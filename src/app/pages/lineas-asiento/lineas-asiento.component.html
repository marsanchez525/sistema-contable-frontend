<h2>Líneas de Asiento</h2>

<button (click)="openModal()">Nueva Línea</button>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>ID Asiento</th>
      <th>Cuenta</th>
      <th>Debe</th>
      <th>Haber</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let l of lineas">
      <td>{{ l.id }}</td>
      <td>{{ l.Id_Asiento }}</td>
      <td>{{ l.Cuenta }}</td>
      <td>{{ l.Debe }}</td>
      <td>{{ l.Haber }}</td>
      <td>
        <button (click)="openModal(l)">Editar</button>
        <button (click)="deleteLinea(l.id)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- MODAL -->
<div class="modal" *ngIf="showModal">
  <div class="modal-content">
    <h3>{{ lineaForm.id ? 'Editar Línea' : 'Nueva Línea' }}</h3>

    <label>ID Asiento</label>
    <input type="number" [(ngModel)]="lineaForm.Id_Asiento">

    <label>Cuenta</label>
    <input type="text" [(ngModel)]="lineaForm.Cuenta">

    <label>Debe</label>
    <input type="number" [(ngModel)]="lineaForm.Debe">

    <label>Haber</label>
    <input type="number" [(ngModel)]="lineaForm.Haber">

    <button (click)="saveLinea()">Guardar</button>
    <button (click)="showModal = false">Cancelar</button>
  </div>
</div>
