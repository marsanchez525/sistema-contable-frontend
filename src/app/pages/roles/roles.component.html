<div class="container">
  <h2>Gestión de Roles</h2>

  <button class="btn-primary" (click)="openModal()">+ Nuevo Rol</button>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of roles">
        <td>{{ r.nombre }}</td>
        <td>{{ r.descripcion }}</td>

        <td>
          <button class="btn-edit" (click)="openModal(r)">Editar</button>
          <button class="btn-delete" (click)="deleteRol(r.id_rol)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal" *ngIf="showModal">
  <div class="modal-content">

    <h3>{{ rolForm.id_rol ? 'Editar Rol' : 'Nuevo Rol' }}</h3>

    <label>Nombre del rol</label>
    <select [(ngModel)]="rolForm.nombre" name="rol">
      <option value="">Seleccione...</option>
      <option value="admin">Administrador</option>
      <option value="usuario">Usuario</option>
    </select>

    <label>Descripción</label>
    <input type="text" [(ngModel)]="rolForm.descripcion" name="descripcion">

    <div class="modal-buttons">
      <button class="btn-primary" (click)="saveRol()">Guardar</button>
      <button class="btn-secondary" (click)="showModal = false">Cancelar</button>
    </div>

  </div>
</div>
