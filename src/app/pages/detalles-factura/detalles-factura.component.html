<div class="detalles-wrapper">

  <h3>Detalles de la Factura #{{ id_factura }}</h3>

  <button class="btn-primary" (click)="openModal()">+ Agregar Ítem</button>

  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>Descripción</th>
          <th>Cantidad</th>
          <th>Precio unitario</th>
          <th>Subtotal</th>
          <th class="text-right">Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let d of detalles">
          <td>{{ d.descripcion }}</td>
          <td>{{ d.cantidad }}</td>
          <td>${{ d.precio_unitario | number:'1.0-0' }}</td>
          <td>${{ d.subtotal | number:'1.0-0' }}</td>

          <td class="text-right">
            <button class="btn-ghost" (click)="openModal(d)">Editar</button>
            <button class="btn-danger" (click)="deleteDetalle(d.id_detalle)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal-dialog">

    <div class="modal-header">
      <h3>{{ detalleForm.id_detalle ? 'Editar ítem' : 'Agregar ítem' }}</h3>
      <button class="modal-close" (click)="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <form>

        <div class="form-grid">

          <div class="form-group form-group-full">
            <label>Descripción</label>
            <input type="text" [(ngModel)]="detalleForm.descripcion" name="descripcion">
          </div>

          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" [(ngModel)]="detalleForm.cantidad" name="cantidad">
          </div>

          <div class="form-group">
            <label>Precio unitario</label>
            <input type="number" [(ngModel)]="detalleForm.precio_unitario" name="precio_unitario">
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn-secondary" type="button" (click)="closeModal()">Cancelar</button>
          <button class="btn-primary" type="button" (click)="saveDetalle()">Guardar</button>
        </div>

      </form>
    </div>

  </div>
</div>
